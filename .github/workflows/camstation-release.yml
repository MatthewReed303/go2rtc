# Builds the go2rtc engine binaries used by CamStation and publishes them as a
# GitHub Release. Differences from upstream releases:
#  - Android builds (GOOS=android) so WebRTC works on Android 11+ (see android.go)
#  - no UPX: Android 8's seccomp filter kills UPX-packed executables (SIGSYS)
#  - SHA256SUMS published alongside the binaries
# Run: push a tag "camstation-<go2rtc version>.<n>", e.g. camstation-1.9.15.1
# (workflow_dispatch builds without releasing; binaries are workflow artifacts).
name: CamStation engine release

on:
  push:
    tags: ['camstation-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          build() { # GOOS GOARCH GOARM output
            echo "::group::$4"
            # Android: wlynxg/anet (all released versions) go:linkname's into
            # net.zoneCache, which the Go 1.23+ linker rejects by default.
            extra=""
            [ "$1" = android ] && extra="-checklinkname=0"
            GOOS=$1 GOARCH=$2 GOARM=$3 \
              go build -ldflags "-s -w $extra" -trimpath -o "dist/$4"
            echo "::endgroup::"
          }
          # android/arm64 links internally; android/arm and android/amd64 need
          # cgo (NDK), so 32-bit phones and x86_64 emulators use the linux
          # builds (fine below Android 11; on 11+ those fall back to RTSP).
          build android arm64 ""  go2rtc_android_arm64
          build linux   arm   7   go2rtc_linux_arm
          build linux   amd64 ""  go2rtc_linux_amd64
          build linux   arm64 ""  go2rtc_linux_arm64
          build windows amd64 ""  go2rtc_windows_amd64.exe
          build windows arm64 ""  go2rtc_windows_arm64.exe
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          file * || true

      - uses: actions/upload-artifact@v4
        with:
          name: go2rtc-camstation
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "go2rtc $(git describe --tags --match 'v*' --abbrev=0) built for CamStation from $(git rev-parse --short HEAD): Android builds (WebRTC on Android 11+), no UPX, DVRIP 0x52 fix. See SHA256SUMS."
